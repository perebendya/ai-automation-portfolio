<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta data-uk-description="Порівняй оренду та фото дев’яти квартир у Києві за своїми побажаннями. Інтерактивний проєкт Дарії Кукли." name="description" content="Compare the rents and photos of nine fictional Kyiv flats against your wish list. An interactive portfolio project by Dariia Kukla.">
  <title data-uk="Пошук житла · Дарія Кукла">AI Rental Assistant · Dariia Kukla</title>
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48 64x64" type="image/x-icon">
  <link rel="stylesheet" href="demo.css?v=footer2">
  <link rel="stylesheet" href="rental.css?v=preferences2">
</head>
<body>
<a class="skip" href="#query" id="skip"></a>
<header class="masthead"><div class="wrap">
  <a class="signature" data-site-link href="index.html"><span class="monogram" aria-hidden="true">dk</span><span data-uk="Дарія Кукла">Dariia Kukla</span></a>
  <nav aria-label="Portfolio navigation">
    <a data-site-link href="index.html" data-uk="Проєкти">Projects</a>
    <a data-site-link href="rental.html" aria-current="page" data-uk="Пошук житла">Rental assistant</a>
    <a data-site-link href="report.html" data-uk="Звіт n8n">n8n report</a>
    <a data-site-link href="boardgames.html" data-uk="Настільні ігри">Board games</a>
  </nav>
  <button id="lang" class="language" type="button" lang="uk">Українською</button>
</div></header>
<main class="wrap">
  <section class="hero" aria-labelledby="hero-title">
    <div><h1 id="hero-title"><span id="title1"></span><br><em id="title2"></em></h1><p class="intro" id="intro"></p></div>
    <button type="button" class="hero-image" id="cover"><img src="assets/rental/c-1.webp" alt="" fetchpriority="high"><span id="cover-caption"></span></button>
  </section>
  <section class="controls" aria-labelledby="question"><form id="query">
    <label for="request" id="question"></label><div class="query-row"><textarea rows="2" maxlength="700" id="request" required></textarea><button class="primary" id="submit" type="submit"></button></div>
  </form><div class="samples"><small id="exampleLabel"></small><div id="examples" class="chips"></div></div></section>
  <section aria-labelledby="results"><div class="linehead"><h2 id="results" tabindex="-1"></h2><span id="filter"></span></div>
    <p id="understood"></p><p id="unmatched"></p><p id="coverage"></p><p id="legend"></p><div id="status" class="sronly" role="status"></div><div class="grid" id="grid"></div>
    <p class="rental-note" id="note"></p>
  </section>
</main>
<footer id="project-footer" class="footer">
  <div class="wrap">
    <p data-uk="Дарія Кукла · Київ">Dariia Kukla · Kyiv</p>
  </div>
</footer>
<dialog id="detail" aria-labelledby="dtitle">
  <div class="dhead"><h2 id="dtitle"></h2><button class="close" id="close" type="button" autofocus></button></div>
  <div class="gallery"><div class="stage"><div id="large"></div><button type="button" id="prev" class="arrow back">‹</button><button type="button" id="next" class="arrow forward">›</button></div>
    <div class="gallerycopy"><strong id="caption" aria-live="polite"></strong><p id="finding"></p><p id="photo-origin"></p></div><div id="thumbs"></div>
  </div>
</dialog>

<script src="portfolio.js"></script>
<script src="rental-catalogue.js?v=preferences2"></script>
<script src="rental-search.js?v=preferences2"></script>
<script>
function formatRent(amount){
  const formatted=amount.toLocaleString(lang ? "en-US" : "uk-UA");
  return lang ? "₴"+formatted : formatted+" грн";
}
function budgetLabel(budget){
  const prefix=budget.exclusive ? text("Менше ніж ","Under ") : text("До ","Up to ");
  return prefix+formatRent(budget.amount);
}

let lang = Number(document.documentElement.lang === "en");
const $ = id => document.getElementById(id);
const t = pair => pair[lang];
const text = (uk,english) => t(en(uk,english));
function element(tag,cls,content){
  const node=document.createElement(tag);
  if(cls) node.className=cls;
  if(content!==undefined) node.textContent=content;
  return node;
}
let lastExample=null;
let applied="";
let parsed=parseRequest(applied);
let gallery=null;
function photoName(flat,i){return t(flat.photos[i])}
function picture(flat,i){
 const img=element("img"); img.src=`assets/rental/${flat.id}-${i+1}.webp`; img.alt=photoName(flat,i)+" · "+t(flat.name);
 return img;
}
function observation(flat,i){
 return photoDetails[flat.id][i].map(t).join(". ")+ ".";
}
function showPhoto(index){
 const flat=gallery.flat, n=flat.photos.length;
 gallery.index=(index+n)%n;
 const i=gallery.index;
 $("large").replaceChildren(picture(flat,i));
 $("caption").textContent=photoName(flat,i)+" · "+(i+1)+"/"+n;
 $("finding").textContent=observation(flat,i);
 [...$("thumbs").children].forEach((button,j)=>button.setAttribute("aria-pressed",String(i===j)));
}
function openDetail(flat,index,trigger){
 gallery={flat,index,trigger};$("dtitle").textContent=t(flat.name);
 $("thumbs").replaceChildren();
 flat.photos.forEach((_,i)=>{
   const button=element("button","thumb");button.type="button";
   button.setAttribute("aria-label",photoName(flat,i));button.append(picture(flat,i));
   button.onclick=()=>showPhoto(i);$("thumbs").append(button);
 });
 showPhoto(index);$("detail").showModal();$("close").focus();
}
function criterionLabel(c){
  if(c.type==="trait") return t(c.dir>0 ? traits[c.key] : opposites[c.key]);
  const label=c.type==="place" ? t(c.label) : c.label;
  return (c.dir<0 ? text("Без: ","Without: ") : "")+label;
}
function drawResults(){
 const {criteria,budget,ignored}=parsed;
 const conditions=criteria.map(criterionLabel);
 if(budget) conditions.unshift(budgetLabel(budget));
 const searched=Boolean(applied);
 $("understood").textContent=conditions.length ? text("Враховано: ","Using: ")+conditions.join(" · ") : "";
 $("unmatched").textContent=ignored.length ? text("Немає даних для перевірки: ","No catalogue evidence for: ")+ignored.map(s=>"«"+s+"»").join(", ") : "";
 $("legend").hidden=!conditions.length;
 const order=flats.filter(flat=>!budget || flat.rent<=budget.maxRent).map(flat=>{
   const evidence=criteria.map(c=>evidenceFor(flat,c));
   const inBudget=Number(Boolean(budget));
   return {flat,evidence,points:evidence.reduce((sum,f)=>sum+f.value,inBudget),
     matches:evidence.filter(f=>f.value>0).length+inBudget};
 }).sort((a,b)=>b.points-a.points || b.matches-a.matches || a.flat.rent-b.flat.rent);
 const grid=$("grid");
 grid.replaceChildren();
 let summary="";
 if(searched && !conditions.length){
   summary=text("Не вдалося перевірити жодну умову. Спробуй описати предмет, колір або деталь інтер’єру.","None of these wishes could be checked. Try an item, a colour or an interior detail.");
 }else if(!order.length){
   summary=text("У цьому бюджеті квартир немає. Найнижча оренда в добірці — ","No flats within this budget. The lowest rent is ")+formatRent(Math.min(...flats.map(f=>f.rent)))+".";
 }else if(searched){
   const best=Math.max(...order.map(row=>row.matches));
   if(ignored.length || best<conditions.length){
     summary=text("Повного збігу немає. Найкращий результат — ","No complete match. The closest flat meets ")+best+text(" з "," of ")+(conditions.length+ignored.length)+text(" умов"," preferences")+".";
   }
 }
 $("coverage").textContent=summary;
 $("status").textContent=[$("understood").textContent,$("unmatched").textContent,summary].filter(Boolean).join(". ");
 if(searched && !conditions.length) return;
 for(const {flat,points,evidence} of order){
   const cover=evidence.find((f,i)=>f.value>0 && criteria[i].type==="detail")
     || evidence.find(f=>f.value>0 && f.photo!=null) || evidence.find(f=>f.value<0 && f.photo!=null);
   const ix=cover?.photo ?? 0;
   const card=element("article","card"),shot=element("button","shot");
   shot.type="button";shot.setAttribute("aria-label",text("Відкрити фото · ","Open photos · ")+t(flat.name));
   shot.onclick=()=>openDetail(flat,ix,shot);
   shot.append(picture(flat,ix),element("span","photo-label",photoName(flat,ix)));
   const body=element("div","cardbody"),head=element("div","cardhead");head.append(element("h3","",t(flat.name)));
   if(conditions.length){
     const score=element("span","points",(points>0?"+":"")+points);
     score.dataset.sign=points>0?"plus":points<0?"minus":"zero";head.append(score);
   }
   const list=element("ul","signals");
   if(budget){
     const saving=budget.amount-flat.rent;
     const message=saving ? formatRent(saving)+text(" до ліміту"," below budget") : text("Рівно в межах бюджету","Exactly on budget");
     list.append(signalRow(flat,1,message,null));
   }
   for(const f of evidence) list.append(signalRow(flat,f.value,t(f.label),f.photo));
   const inspect=element("button","inspect",text(`Переглянути ${flat.photos.length} фото`,`View ${flat.photos.length} photos`));
   inspect.onclick=()=>openDetail(flat,ix,inspect);
   body.append(head,element("div","meta",formatRent(flat.rent)+text(" / місяць"," / month")),list,inspect);
   card.append(shot,body);grid.append(card);
 }
}
function signalRow(flat,value,label,photo){
 const li=element("li");
 const icon=element("span","ico "+(value<0?"bad":value===0?"unknown":""),value===0?"?":value>0?"✓":"×");
 icon.setAttribute("aria-label",value===0?text("Невідомо","Unknown"):value>0?text("Збіг","Match"):text("Суперечність","Conflict"));
 li.append(icon);
 if(photo!=null && value!==0){
   const proof=element("button","evidence-link",label);
   proof.type="button";proof.onclick=()=>openDetail(flat,photo,proof);
   proof.setAttribute("aria-label",label+text(" · відкрити фото"," · open photo"));
   li.append(proof);
 }else li.append(element("span","",label));
 return li;
}
function applyQuery(query,example=null){
 $("request").setCustomValidity("");
 lastExample=example;applied=query.trim();parsed=parseRequest(applied);drawResults();
 markExample();
}
function focusShortlist(){
 if (matchMedia("(max-width:760px)").matches) $("results").focus();
}
function markExample(){
 [...$("examples").children].forEach((button,i)=>button.setAttribute("aria-pressed",String(i===lastExample)));
}
function translate(){
 const copy={
  title1:en("Квартира в Києві","A flat in Kyiv"),title2:en("під твій запит","that fits your life"),
  skip:en("До пошуку","Skip to search"),
  "cover-caption":en("Поділ · переглянути кухню","Podil · explore the kitchen"),
  intro:en("Серед дев’яти квартир знайди ту, де тобі буде зручно. Вкажи бюджет і що для тебе важливо вдома, а потім перевір збіги на фото.","Find your fit among nine Kyiv flats. Set a rent limit and describe what matters to you at home, then check the photos behind each match."),
  question:en("Опиши своїми словами, яку квартиру шукаєш","Describe the flat you’re looking for in your own words"),
  submit:en("Підібрати квартири","Find my matches"),exampleLabel:en("Спробуй запит","Try a request"),
  results:en("Твоя добірка","Your shortlist"),filter:en("Київ · 1 кімната","Kyiv · 1 room"),
  legend:en("Збіг +1 · Суперечність −1 · Не видно на фото 0","Match +1 · Conflict −1 · Not visible 0"),
  note:en("У Telegram-боті ти своїми словами описуєш, що для тебе важливо. Gemini розбирає твій запит і аналізує фото оголошень для підбору квартир. Для цієї демки я заздалегідь описала фото дев’яти квартир. Пошук порівнює твої побажання з цими описами прямо у браузері, без підключення до ШІ-моделі.","In the Telegram bot, you describe what matters to you in your own words. Gemini interprets your request and analyses listing photos to help find a flat. For this demo, I wrote descriptions of the photos for nine flats. The search compares your wishes with those descriptions in your browser, without calling an AI model."),
  "photo-origin":en("Фото згенеровано для демо, щоб показати різні інтер’єри без публікації чужих знімків з оголошень.","I generated these interiors for the demo so I could show a range of flats without republishing anyone’s listing photos."),
  close:en("Закрити","Close")};
 for(const [id,label] of Object.entries(copy))$(id).textContent=t(label);
 const rents=flats.map(flat=>flat.rent);
 $("filter").textContent+=" · "+formatRent(Math.min(...rents))+" – "+formatRent(Math.max(...rents))+text("/міс.","/month");
 $("request").placeholder=text("Наприклад, хочу письмовий стіл біля вікна і засклений балкон.","For example, I’d like a desk by the window and an enclosed balcony.");$("examples").replaceChildren();
 examples.forEach(({label,query},i)=>{
   const button=element("button","chip",t(label));button.type="button";
   button.onclick=()=>{
     $("request").value=t(query);applyQuery($("request").value,i);focusShortlist();
   };
   $("examples").append(button);
 });
 $("prev").setAttribute("aria-label",text("Попереднє фото","Previous photo"));$("next").setAttribute("aria-label",text("Наступне фото","Next photo"));
 markExample();drawResults();
}
$("request").value=applied;
$("query").onsubmit=e=>{
 e.preventDefault();
 const field=$("request");
 if(!field.value.trim()){
   field.setCustomValidity(text("Опиши, що шукаєш у квартирі.","Describe what you want in a flat."));
   field.reportValidity();
   return;
 }
 applyQuery(field.value);focusShortlist();
};
$("request").oninput=()=>$("request").setCustomValidity("");
$("cover").onclick=()=>openDetail(flats[2],0,$("cover"));
$("request").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();$("query").requestSubmit()}};
document.addEventListener("portfolio-language",()=>{
 const wasPreset=lastExample!==null && $("request").value===t(examples[lastExample].query);
 lang=Number(document.documentElement.lang === "en");
 if(wasPreset){$("request").value=t(examples[lastExample].query);applyQuery($("request").value,lastExample)}
 translate();
});
$("close").onclick=()=>$("detail").close();
$("detail").onclose=()=>{gallery?.trigger.focus({preventScroll:true});gallery=null;};
$("detail").onclick=e=>{
 if(e.target!==$("detail"))return;
 const box=$("detail").getBoundingClientRect();
 if(e.clientX<box.left || e.clientX>box.right || e.clientY<box.top || e.clientY>box.bottom)$("detail").close();
};
$("prev").onclick=()=>showPhoto(gallery.index-1);$("next").onclick=()=>showPhoto(gallery.index+1);
$("detail").onkeydown=e=>{
 if(e.key==="Tab"){
   const buttons=[...$("detail").querySelectorAll("button")];
   const current=buttons.indexOf(document.activeElement);
   e.preventDefault();
   buttons[(current+(e.shiftKey?-1:1)+buttons.length)%buttons.length].focus();
 }else if(["ArrowLeft","ArrowRight"].includes(e.key)){
   e.preventDefault();showPhoto(gallery.index+(e.key==="ArrowRight"?1:-1));
 }
};
translate();

</script></body></html>
