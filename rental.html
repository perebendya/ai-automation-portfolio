  [0,-1,/килим[а-яіїєґ]*|ков[её]р[а-я]*|ковр[а-я]*|carpets?|rugs?/gu],
  [1,-1,/яскрав[а-яіїєґ]*|кислотн[а-яіїєґ]*|вирви[ -]?глаз[а-яіїєґ]*|вирви[ -]?око|кричущ[а-яіїєґ]*|салатов[а-яіїєґ]*|лаймов[а-яіїєґ]*|bright(?:ly)?|neon|loud|garish|flashy|lime.green/gu],
  [1,1,/спокійн[а-яіїєґ]*|нейтральн[а-яіїєґ]*|стриман[а-яіїєґ]*|приглушен[а-яіїєґ]*|пастельн[а-яіїєґ]*|бежев[а-яіїєґ]*|muted|calm|neutral|understated|pastel|subdued/gu],
  [2,1,/ліж[а-яіїєґ]*|матрац[а-яіїєґ]*|\bbeds?\b|mattress(?:es)?/gu],
  [2,-1,/диван[а-яіїєґ]*|sofas?|couch(?:es)?/gu],
  [3,1,/письмов[а-яіїєґ]*\s+ст[іо]л[а-яіїєґ]*|робоч[а-яіїєґ]*\s+місц[а-яіїєґ]*|(?:^|\s)ст(?:іл|олом|олу|ола)(?=\s|$)|працю[а-яіїєґ]*\s+(?:з\s+дому|вдома|за\s+ноутбуком)|desk|work(?:ing)? from home|workstation|workspace/gu],
  [4,1,/балкон[а-яіїєґ]*|лоджі[а-яіїєґ]*|balcon(?:y|ies)|loggia/gu],
  [5,1,/ванн(?:у|а|ою|і)|bathtub|\btub\b|(?:take|taking|have|having|love)\s+(?:a\s+)?baths?/gu],
  [5,-1,/душ(?:ову|ова|овій|і|ем|у)?(?=\s|$)|shower(?:s|ing)?/gu]
];
const indifferent = /байдуж|все одно|неважлив|не важлив|не принципов|не заважа|не хвилю|не проти|мені ок|можна залишити|без різниці|don't (?:mind|care)|do not (?:mind|care)|doesn't matter|is fine|are fine|no preference|okay with|ok with/i;
const negBefore = /(?:без|жодн[а-яіїєґ]*|уника[а-яіїєґ]*|не(?:\s+(?:хочу|люблю|треба|потріб[а-яіїєґ]*|має бути|мала бути|була|було|були|висів|висіли|було видно|подоба[а-яіїєґ]*))?|\b(?:without|no|avoid|not|don't want|don't like|hate|rather than))\s+(?:(?:бабусин[а-яіїєґ]*|радянськ[а-яіїєґ]*|совков[а-яіїєґ]*|стар[а-яіїєґ]*|ніяких|жодних|ніякого|настінних|цих|той|такого|на|спати|навіть|дуже|надто|занадто|яскрав[а-яіїєґ]*|any|a|an|the|sleeping|sleep|on|wall|wall-mounted|very|too)\s+)*$/iu;
const negAfter = /^\s*(?:на\s+стіні\s+|на\s+стінах\s+)?(?:не було|не було видно|не висів|не хочу|не люблю|не треба|не підходить|не подоба|не потріб|мені не треба|is a dealbreaker|are a dealbreaker)/iu;
function parseRequest(raw) {
  const choices = new Map();
  const ignored = [];
  const normalized = raw.toLowerCase().replace(/[’‘ʼ]/g,"'").replace(/нехай буде/g,"хочу");
  // Keep the direction in contrast clauses such as "a bed rather than a sofa".
  const clauses = normalized.replace(/\b(rather than)\b/gu, ",not ").replace(/\sа не\s/gu,",не ").split(/[.,;!?\n]+|\s+(?:але|а от|проте|but|however)\s+|\s+(?:і|й|та|and)\s+(?=(?:без|не |хочу|колір|килим|мені|потріб|якщо|no |i |without|don't|not |want |need ))/iu);
  for(const part of clauses.map(s=>s.trim()).filter(Boolean)) {
    const found=[];
    for(const [key,dir,pattern] of phrases) {
      for(const match of part.matchAll(pattern)) {
        if(key===1 && !/кух|фасад|кол[іь]ор|кольор|kitchen|cabinet|colou?r/u.test(normalized)) continue;
        if(key===0 && /на підлозі|floor rug|floor carpet/u.test(part)) continue;
        found.push({key,dir, start:match.index, end:match.index+match[0].length});
      }
    }
    found.sort((a,b)=>a.start-b.start);
    if(!found.length) {
      if(!indifferent.test(part) && !/^(?:тож|і|й|та|мені|будь ласка|please|thanks|дякую|hello|hi|привіт)$/u.test(part)) ignored.push(part);
      continue;
    }
    for(let pos=0;pos<found.length;pos++){
      const f=found[pos];
      const before=part.slice(pos?found[pos-1].end:0,f.start);
      const after=part.slice(f.end,found[pos+1]?.start);
      if(indifferent.test(before+" "+after)){choices.delete(f.key);continue}
      const carriesNeg=pos>0 && /^\s*(?:і|й|та|або|and|or)\s*$/u.test(before) && found[pos-1].negated;
      const neg=carriesNeg || negBefore.test(before.trimEnd()+" ") || negAfter.test(after) || /на\s*$/u.test(before)&&/спати не хочу|спати не буду/u.test(after);
      f.negated=neg;
      choices.set(f.key, f.dir*(neg?-1:1));
    }
    // Make unsupported location, budget and pet constraints visible even in mixed requests.
    const other=part.match(/(?:метро|тварин|котом|кішк[а-яіїєґ]*|паркінг|поверх|до\s+\d[\d\s]*\s*(?:грн|тисяч)|near (?:the )?metro|parking|pets?|\bcat\b|under\s+[₴$£€]?\d+)/iu);
    if(other)ignored.push(other[0]);
  }
  return {choices,ignored:[...new Set(ignored)]};
}

const initialLang = new URLSearchParams(location.search).get("lang");
let lang = initialLang==="en" ? 1 : initialLang==="uk" ? 0 : Number(!navigator.language.toLowerCase().startsWith("uk"));
const $ = id => document.getElementById(id);
const t = pair => pair[lang];
const text = (uk,english) => t(en(uk,english));
function element(tag,cls,content){
  const node=document.createElement(tag);
  if(cls) node.className=cls;
  if(content!==undefined) node.textContent=content;
  return node;
}
let lastExample=0;
let applied=t(examples[0]);
let parsed=parseRequest(applied);
let gallery=null;
const photoTitles=[
 [en("Кухня","Kitchen"),en("Спальня","Bedroom"),en("Санвузол","Bathroom"),en("Засклений балкон","Enclosed balcony")],
 [en("Кухня","Kitchen"),en("Вітальня","Living room"),en("Душова","Shower room"),en("Відкритий балкон","Open balcony")],
 [en("Кухня","Kitchen"),en("Санвузол","Bathroom"),en("Передпокій","Entrance hall"),en("Письмовий стіл","Desk")]
];
function photoName(flat,i){return t(photoTitles[flats.indexOf(flat)][i])}
function picture(flat,i){
 const img=element("img"); img.src=imgs[flat.id][i]; img.alt=photoName(flat,i)+" · "+t(flat.name);
 return img;
}
function observation(flat,i){
 const facts=flat.facts.filter(f=>f[1]===i&&f[0]!==0).map(f=>t(f[2]));
 return facts.length ? facts.join(". ")+".":text("На фото видно передпокій і вхідні двері.","The photo shows the entrance hall and front door.");
}
function showPhoto(index){
 const flat=gallery.flat, n=imgs[flat.id].length;
 gallery.index=(index+n)%n;
 const i=gallery.index;
 $("large").replaceChildren(picture(flat,i));
 $("caption").textContent=photoName(flat,i)+" · "+(i+1)+"/"+n;
 $("finding").textContent=observation(flat,i);
 [...$("thumbs").children].forEach((button,j)=>button.setAttribute("aria-pressed",String(i===j)));
}
function openDetail(flat,index){
 gallery={flat,index};$("dtitle").textContent=t(flat.name);
 $("thumbs").replaceChildren();
 imgs[flat.id].forEach((_,i)=>{
   const button=element("button","thumb");button.type="button";
   button.setAttribute("aria-label",photoName(flat,i));button.append(picture(flat,i));
   button.onclick=()=>showPhoto(i);$("thumbs").append(button);
 });
 showPhoto(index);$("detail").showModal();
}
function sum(flat){let total=0;for(const [i,dir] of parsed.choices)total+=flat.facts[i][0]*dir;return total}
function drawResults(){
 const active=[...parsed.choices.keys()].sort((a,b)=>a-b);
 $("understood").textContent=active.length ? text("Враховано: ","Using: ")+active.map(i=>t(parsed.choices.get(i)>0?traits[i]:opposites[i])).join(" · ") : text("Немає умов для порівняння. Запитай про кухню, настінний килим, ліжко, стіл, балкон або ванну.","No matching preferences. Try the kitchen, wall rugs, sleeping area, desk, balcony or bath.");
 $("unmatched").textContent=parsed.ignored.length ? text("Поза можливостями демо: ","Outside this demo: ")+parsed.ignored.map(s=>"«"+s+"»").join(", ") : "";
 const order=[...flats].sort((a,b)=>sum(b)-sum(a));
 $("grid").replaceChildren();
 for(const flat of order){
   const points=sum(flat), cover=active.find(i=>flat.facts[i][0]*parsed.choices.get(i)<0)??active.find(i=>flat.facts[i][0]!==0)??active[0]??1;
   const ix=flat.facts[cover][1],card=element("article","card"),shot=element("button","shot");
   shot.type="button";shot.setAttribute("aria-label",text("Відкрити фото · ","Open photos · ")+t(flat.name));shot.onclick=()=>openDetail(flat,ix);
   shot.append(picture(flat,ix),element("span","photo-label",photoName(flat,ix)));
   const body=element("div","cardbody"),head=element("div","cardhead");head.append(element("h3","",t(flat.name)));
   if(active.length){
     const score=element("span","points",(points>0?"+":"")+points);score.dataset.sign=points>0?"plus":points<0?"minus":"zero";head.append(score);
   }
   const list=element("ul","signals");
   for(const i of active){
     const [value,,label]=flat.facts[i], contribution=value*parsed.choices.get(i), li=element("li");
     const icon=element("span","ico "+(contribution<0?"bad":contribution===0?"unknown":""),contribution===0?"?":contribution>0?"✓":"×");
     icon.setAttribute("aria-label",contribution===0?text("Невідомо","Unknown"):contribution>0?text("Збіг","Match"):text("Суперечність","Conflict"));
     li.append(icon,element("span","",t(label)));list.append(li);
   }
   const inspect=element("button","inspect",text("Переглянути 4 фото","View 4 photos"));inspect.onclick=()=>openDetail(flat,ix);
   body.append(head,element("div","meta",text("18 000 грн / місяць","₴18,000 / month")),list,inspect);card.append(shot,body);$("grid").append(card);
 }
 $("status").textContent=$("understood").textContent+". "+order.map(f=>t(f.name)+" "+sum(f)).join(", ");
}
function applyQuery(query,example=null){
 lastExample=example;applied=query.trim();parsed=parseRequest(applied);drawResults();
}
function translate(){

 const copy={
  title1:en("Однакові у фільтрах.","Same search filters."),title2:en("Різні на фото.","Different in the photos."),
  intro:en("Три квартири з однаковою ціною й кількістю кімнат. Розкажи, як хочеш жити, і перевір на фото, чому одна з них підходить тобі краще.","Three flats with the same rent and room count. Describe how you want to live, then inspect the photos behind your shortlist."),
  question:en("Яку квартиру ти шукаєш?","What are you looking for in a flat?"),
  submit:en("Підібрати квартири","Find my matches"),exampleLabel:en("Спробуй запит","Try a request"),
  results:en("Твоя добірка","Your shortlist"),filter:en("Київ · 1 кімната · 18 000 грн/міс.","Kyiv · 1 room · ₴18,000/month"),
  legend:en("Збіг +1 · Суперечність −1 · Не видно на фото 0","Match +1 · Conflict −1 · Not visible 0"),
  note:en("У Telegram-боті Gemini перетворює розмову на критерії й аналізує знімки. Це автономне демо з локальним розбором фраз про шість побажань. Оголошення та фото вигадані, спостереження підготовлені заздалегідь.","In the Telegram bot, Gemini turns conversation into preferences and analyses photos. This standalone demo interprets phrases about six preferences locally, using fictional listings, generated photos and prepared observations."),
  portfolio:en("Портфоліо Дарії","Dariia’s portfolio"),close:en("Закрити","Close")};
 for(const [id,label] of Object.entries(copy))$(id).textContent=t(label);
 $("request").placeholder=t(examples[0]);$("examples").replaceChildren();
 const labels=[en("Про кухню й килими","Kitchen and wall rugs"),en("Працюю з дому","I work from home"),en("Кава на балконі","Coffee on the balcony")];
 labels.forEach((label,i)=>{const b=element("button","chip",t(label));b.type="button";b.onclick=()=>{$("request").value=t(examples[i]);applyQuery($("request").value,i)};$("examples").append(b)});
 $("prev").setAttribute("aria-label",text("Попереднє фото","Previous photo"));$("next").setAttribute("aria-label",text("Наступне фото","Next photo"));
 drawResults();
}
$("request").value=applied;
$("query").onsubmit=e=>{e.preventDefault();applyQuery($("request").value)};
$("request").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();$("query").requestSubmit()}};
$("lang").onclick=()=>{
 const wasPreset=lastExample!==null && $("request").value===t(examples[lastExample]);
 lang=1-lang;const u=new URL(location.href);u.searchParams.set("lang",lang?"en":"uk");try{history.replaceState(null,"",u)}catch{}
 if(wasPreset){$("request").value=t(examples[lastExample]);applyQuery($("request").value,lastExample)}
 translate();
};
$("close").onclick=()=>$("detail").close();$("detail").onclick=e=>{if(e.target===$("detail"))$("detail").close()};
$("prev").onclick=()=>showPhoto(gallery.index-1);$("next").onclick=()=>showPhoto(gallery.index+1);
$("detail").onkeydown=e=>{if(["ArrowLeft","ArrowRight"].includes(e.key)){e.preventDefault();showPhoto(gallery.index+(e.key==="ArrowRight"?1:-1))}};
translate();
