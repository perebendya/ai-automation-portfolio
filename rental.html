const flats = [
 {id:"a", name:en("Нивки","Nyvky"), facts:[

 [1,0,en("Кремові фасади й дерев’яна стільниця","Cream cabinet fronts and a wood-tone worktop")],

 {id:"b", name:en("Лук’янівка","Lukianivka"), facts:[

 {id:"c", name:en("Поділ","Podil"), facts:[

];
const photoNames=[en("Кухня","Kitchen"),en("Кімната","Room"),en("Ванна","Bathroom")];
const initialLang=new URLSearchParams(location.search).get("lang");
let lang=initialLang==="en"?1:initialLang==="uk"?0:Number(!navigator.language.toLowerCase().startsWith("uk"));
const selected=new Set([0,1]);
const $=id=>document.getElementById(id);
const t=pair=>pair[lang];
function element(tag,cls,text){const node=document.createElement(tag);if(cls)node.className=cls;if(text!==undefined)node.textContent=text;return node}
function picture(flat,which){const img=element("img");img.src=imgs[flat.id][which];img.alt=t(flat.facts.filter(f=>f[1]===which && f[0]!==0).map(f=>f[2]).shift()||en("Демонстраційне фото квартири","Sample apartment photo"));return img}
const photoName=(flat,index)=>t(photoNames[index===0?0:flat.id==="c"?2:1]);
function sum(flat){return [...selected].reduce((total,i)=>total+flat.facts[i][0],0)}
function openDetail(flat,which){
 const box=$("dbody");box.replaceChildren();$("dtitle").textContent=t(flat.name);$("close").textContent=t(en("Закрити","Close"));
 for(const ix of [which,1-which]){const fig=element("figure");fig.append(picture(flat,ix),element("figcaption","",photoName(flat,ix)));const notes=flat.facts.filter(f=>f[1]===ix&&f[0]!==0).map(f=>t(f[2]));if(notes.length)fig.append(element("p","",notes.join(". ")+"."));
 if(flat.id==="c"&&ix===0)fig.append(element("p","",t(en("Такий ракурс не дозволяє сказати, чи висить килим у кімнаті.","This crop cannot tell us whether a rug hangs on the living room wall."))));
 box.append(fig)}
 $("detail").showModal()
}
function draw(){
 document.documentElement.lang=lang?"en":"uk";$("lang").textContent=lang?"Українською":"English";
 const copy={title1:en("Однакові у фільтрах.","Same search filters."),title2:en("Різні на фото.","Different in the photos."),intro:en("Три однокімнатні квартири за 18 000 грн. Зміни побажання й подивись, які деталі на фото піднімуть квартиру у твоєму списку.","Three one-room flats at ₴18,000. Choose what matters to you and see which details in the photos move a listing up your shortlist."),legend:en("Збіг +1 · Суперечність −1 · Не видно на фото 0","Match +1 · Conflict −1 · Not visible 0"),question:en("Що для тебе важливо?","What matters to you?"),results:en("Твоя добірка","Your shortlist"),filter:en("Київ · 1 кімната · 18 000 грн/міс.","Kyiv · 1 room · ₴18,000/month"),note:en("Демо на вигаданих оголошеннях і згенерованих фото. Спостереження підготовлені заздалегідь. У боті фото аналізує Gemini. Колір кухні й настінні килими — додаткові критерії цього демо.","Fictional listings and generated photos with prepared visual observations. The Telegram bot uses Gemini to analyse listing photos. Kitchen colours and wall rugs are additional demo criteria."),portfolio:en("Портфоліо Дарії","Dariia’s portfolio")};
 for(const [id,label] of Object.entries(copy))$(id).textContent=t(label);
 $("chips").replaceChildren();
 traits.forEach((label,i)=>{const btn=element("button","chip",(selected.has(i)?"✓  ":"+  ")+t(label));btn.type="button";btn.setAttribute("aria-pressed",String(selected.has(i)));btn.setAttribute("aria-label",t(label));btn.onclick=()=>{selected.has(i)?selected.delete(i):selected.add(i);draw();$("chips").children[i].focus()};$("chips").append(btn)});
 const order=[...flats].sort((a,b)=>sum(b)-sum(a));$("grid").replaceChildren();
 for(const flat of order){const points=sum(flat);const id=flat.id;const active=[...selected].sort((a,b)=>a-b);
 const focus=active.find(i=>flat.facts[i][0]<0)??active.find(i=>flat.facts[i][0]>0)??active[0]??1;
 const which=flat.facts[focus][1];const card=element("article","card"),shot=element("button","shot");shot.type="button";shot.setAttribute("aria-label",t(en("Відкрити фото квартири","Open apartment photos"))+" · "+t(flat.name));shot.onclick=()=>openDetail(flat,which);shot.append(picture(flat,which),element("span","photo-label",photoName(flat,which)+" · 1/2"));
 const body=element("div","cardbody"),head=element("div","cardhead");head.append(element("h3","",t(flat.name)));if(active.length){const score=element("span","points",(points>0?"+":"")+points);score.dataset.sign=points>0?"plus":points<0?"minus":"zero";score.title=t(en("Збіг +1, суперечність −1, невідомо 0","Match +1, conflict −1, unknown 0"));head.append(score)}
 const list=element("ul","signals");
 for(const i of active){const [value,,text]=flat.facts[i];const li=element("li");const badge=element("span","ico "+(value<0?"bad":value===0?"unknown":""),value===0?"?":value>0?"✓":"×");badge.setAttribute("aria-label",t(value===0?en("Невідомо","Unknown"):value>0?en("Збіг","Match"):en("Суперечність","Conflict")));li.append(badge,element("span","",t(text)));list.append(li)}
 if(!active.length)list.append(element("li","",t(en("Обери побажання, щоб порівняти фото.","Select a preference to compare photos."))));
 const inspect=element("button","inspect",t(en("Роздивитися обидва фото","Inspect both photos")));inspect.onclick=()=>openDetail(flat,which);body.append(head,element("div","meta",t(en("18 000 грн / місяць","₴18,000 / month"))),list,inspect);card.append(shot,body);$("grid").append(card)}

}
$("lang").onclick=()=>{lang=1-lang;const u=new URL(location.href);u.searchParams.set("lang",lang?"en":"uk");try{history.replaceState(null,"",u)}catch{}draw()};
$("close").onclick=()=>$("detail").close();$("detail").addEventListener("click",e=>{if(e.target===$("detail"))$("detail").close()});draw();
